<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>芸人ガチャ ＜よしもと＞</title>
<style>
    /* 全体のデザイン（ノート風の背景） */
    body {
        background-color: #f0f2f5;
        background-image: linear-gradient(transparent 95%, #e1e5ea 5%);
        background-size: 100% 1.5em;
        color: #333;
        font-family: "Yu Mincho", "MS Mincho", "Hiragino Mincho ProN", serif;
        margin: 0;
        padding: 10px;
        display: flex;
        justify-content: center;
        box-sizing: border-box;
    }

    #game-container, #main-screen {
        background-color: #ffffff;
        width: 100%;
        max-width: 420px;
        padding: 15px 12px;
        border: 2px solid #2c3e50;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        position: relative;
        box-sizing: border-box;
    }
    #game-container::before, #main-screen::before {
        content: "";
        position: absolute;
        top: 3px; left: 3px; right: 3px; bottom: 3px;
        border: 1px solid #2c3e50;
        pointer-events: none;
    }

    .form-title {
        color: #2c3e50;
        font-size: 1.3em;
        letter-spacing: 0.2em;
        margin-top: 0;
        margin-bottom: 20px;
        border-bottom: 1px solid #2c3e50;
        padding-bottom: 8px;
        display: inline-block;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
    }
    .stamp {
        position: absolute;
        top: 12px; right: 12px;
        width: 50px; height: 50px;
        border: 2px solid #d9534f;
        border-radius: 50%;
        color: #d9534f;
        font-weight: bold; font-size: 0.8em;
        display: flex; align-items: center; justify-content: center;
        text-align: center; line-height: 1.1;
        transform: rotate(15deg); opacity: 0.8;
    }
    .form-row { display: flex; margin-bottom: 10px; align-items: baseline; }
    .form-label { width: 110px; font-size: 0.8em; color: #666; flex-shrink: 0; }
    .form-value { font-size: 0.95em; color: #111; flex-grow: 1; word-break: break-all; }
    .name-value { font-size: 1.3em; letter-spacing: 0.05em; }
    .special-buff { color: #d95319; font-size: 0.75em; display: block; font-weight: bold; margin-top: 2px; font-family: 'Helvetica Neue', Arial, sans-serif; }
    
    input[type="text"] {
        font-family: "Yu Mincho", "MS Mincho", serif; font-size: 0.95em; padding: 6px;
        border: 1px solid #ccc; border-radius: 3px; width: 95%; background-color: #fafafa;
        box-sizing: border-box;
    }
    input[type="text"]:focus { border-color: #2c3e50; outline: none; background-color: #fff; }

    .btn-area { text-align: center; margin-top: 20px; font-family: 'Helvetica Neue', Arial, sans-serif; }
    button {
        background-color: #2c3e50; color: #ffffff; border: none;
        padding: 10px 18px; font-size: 0.95em; border-radius: 4px;
        cursor: pointer; transition: background-color 0.2s, transform 0.1s;
        margin: 4px;
        box-sizing: border-box;
    }
    button:hover { background-color: #1a252f; }
    button:active { transform: scale(0.98); }
    
    #status-bar {
        background-color: #2c3e50; color: #fff; padding: 8px; border-radius: 4px;
        font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.75em;
        display: flex; flex-wrap: wrap; justify-content: space-between; margin-bottom: 15px;
        box-sizing: border-box;
    }
    .status-item { width: 32%; margin-bottom: 4px; }
    .status-item span { color: #f39c12; font-weight: bold; font-size: 1.1em; }
    
    .status-header { 
        width: 100%; font-size: 1em; font-weight: bold; margin-bottom: 8px; 
        color: #f0f2f5; border-bottom: 1px solid #555; padding-bottom: 4px;
        display: flex; justify-content: space-between; align-items: center;
    }
    
    #story-area {
        background-color: #fafafa; padding: 12px; border: 1px solid #ccc; border-radius: 4px;
        min-height: 100px; font-size: 0.95em; line-height: 1.6; margin-bottom: 15px;
        box-sizing: border-box;
    }
    #choices-area { display: flex; flex-direction: column; gap: 8px; font-family: 'Helvetica Neue', Arial, sans-serif; }
    .choice-btn { background-color: #d95319; font-weight: bold; font-size: 0.9em; width: 100%; text-align: center; }
    .choice-btn:hover { background-color: #bf4310; }

    #history-area {
        margin-top: 15px;
        padding: 10px;
        background-color: #1a252f;
        color: #ecf0f1;
        border-radius: 4px;
        height: 120px;
        overflow-y: auto;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 0.8em;
        border: 2px solid #ccc;
        box-sizing: border-box;
    }
    .history-entry {
        margin-bottom: 4px;
        border-bottom: 1px dotted #7f8c8d;
        padding-bottom: 3px;
    }
    .history-entry:last-child {
        border-bottom: none;
    }
    .history-date {
        color: #f39c12;
        font-weight: bold;
        margin-right: 6px;
    }

    .hidden { display: none !important; }
</style>
</head>
<body>

<div id="start-screen" style="text-align: center; width: 100%; max-width: 420px; margin-top: 30px; font-family: 'Helvetica Neue', Arial, sans-serif; box-sizing: border-box;">
    <h1 style="color: #2c3e50; font-size: 1.8em; margin-bottom: 10px;">芸人ガチャ <span style="color:#d95319; font-size:0.8em;">＜よしもと＞</span></h1>
    <p style="color: #555; line-height: 1.5; font-size: 0.95em; padding: 0 10px;">笑える人生になるかはあなた次第。<br>あなたの芸人人生は、ここから決まります。</p>
    <button onclick="rollGacha()" style="margin-top: 15px; width: 80%;">願書を作成する</button>
</div>

<div id="game-container" class="hidden">
    <div class="stamp">願書<br>作成中</div>
    <div class="form-title">入 学 願 書</div>
    <div id="stats-content"></div>
    <div id="naming-area" style="border-top: 2px solid #2c3e50; margin-top: 15px; padding-top: 12px;">
        <div class="form-row" style="flex-direction: column; align-items: flex-start;">
            <div class="form-label" id="naming-label" style="font-weight: bold; color: #2c3e50; margin-bottom: 4px;">コンビ名 (任意)</div>
            <div class="form-value" style="width: 100%;"><input type="text" id="name-input" placeholder="未入力で自動生成されます"></div>
        </div>
        <div class="btn-area" style="margin-top: 15px;"><button onclick="submitForm()" style="width: 100%;">この内容で願書を提出する</button></div>
    </div>
</div>

<div id="result-screen" class="hidden" style="text-align: center; width: 100%; max-width: 420px; margin-top: 30px; font-family: 'Helvetica Neue', Arial, sans-serif; background: #fff; padding: 25px 15px; border: 2px solid #2c3e50; position: relative; box-sizing: border-box;">
    <div class="stamp" style="border-color: #5cb85c; color: #5cb85c; transform: rotate(-10deg);">受理済</div>
    <h2 style="color: #2c3e50; font-size: 1.3em;">願書を受理しました</h2>
    <p id="final-announcement" style="font-size: 1em; font-weight: bold; color: #d95319; margin: 20px 0; word-break: break-all;"></p>
    <button onclick="startGame()" style="margin-top: 10px; width: 80%;">NSCに入学する</button>
</div>

<div id="main-screen" class="hidden">
    <div id="status-bar">
        <div class="status-header">
            <span><span id="ui-time-label">NSC 4月</span> (<span id="ui-age">22</span>歳)</span>
            <span id="ui-combi-name" style="color:#f39c12; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
            <span id="ui-combi-duration" style="font-size:0.8em; font-weight:normal;">結成:0年</span>
        </div>
        <div class="status-item">資金: <span id="ui-money">0</span>万</div>
        <div class="status-item">体力: <span id="ui-stamina">100</span></div>
        <div class="status-item">ネタ力: <span id="ui-neta">5</span></div>
        <div class="status-item">平場力: <span id="ui-hiraba">5</span></div>
        <div class="status-item">人気: <span id="ui-pop">0</span></div>
        <div class="status-item" id="ui-relation-box">コンビ仲: <span id="ui-relation">50</span></div>
    </div>
    
    <div id="story-area">
        ここにテキストが表示されます。
    </div>

    <div id="choices-area"></div>

    <div id="history-area">
        <div style="color: #bdc3c7; margin-bottom: 6px; font-weight: bold; font-size: 0.9em;">▼ 芸人人生の記録</div>
        <div id="history-content"></div>
    </div>
</div>

        {name: '徳島県', weight: 1}, {name: '香川県', weight: 1}, {name: '愛媛県', weight: 1}, {name: '高知県', weight: 1},
        {name: '佐賀県', weight: 1}, {name: '長崎県', weight: 1}, {name: '熊本県', weight: 1}, {name: '大分県', weight: 1}, {name: '宮崎県', weight: 1}, {name: '鹿児島県', weight: 1}

    const families = [

        {name: '貧乏（奨学金とバイト頼り）', weight: 23}, {name: 'その日暮らしの極貧', weight: 5},

    const namePart1 = ['鉄骨', '東京', '電脳', 'ぽけっと', 'スーパー', '爆笑', 'センチメンタル', 'マカロニ', '真空', '純白', '弾丸', '黄金', '令和', '昭和', '平成', '世紀末', '幻の', '疾風', '漆黒', '虹色', '逆襲の', '永遠の', '週末', '深夜', '無限', '電撃', 'マッハ', 'ミラクル', 'ハッピー', 'アバンギャルド', 'ストロベリー', 'ダンボール', '雑草', '都会の', '宇宙'];

    const singleNames = ['末脚自慢', 'タスカータソルテ', 'メトロノーム', 'ペトリコール', '蜃気楼', 'かげろう', 'ガレージ', '信号機', 'シャンプー', '冷蔵庫', '蛍光灯', 'ノートブック', 'カレンダー', 'ヴェルトライゼンデ', 'バンソウコウ', 'ほうき星', 'ブーメラン', 'アンテナ', '万華鏡', 'クレヨン', '画用紙', '少年の詩', 'ビー玉', 'けん玉', 'ルヴァンスレーヴ', 'ブランコ', 'すべり台', 'ジャングルジム', 'シーソー', 'ベンチ', '交差点', '南改札口', 'デュランダル', 'ぼくの路線図', 'つり革', '網棚', 'ブエナビスタ', 'キンチェム', 'パスポート', '辞書', '図鑑', '地図', '羅針盤', '望遠鏡', '顕微鏡', '虫眼鏡', 'フラスコ', 'ビーカー', 'ピンセット', 'アルコール'];

    const partnerArchetypes = [
        { desc: 'ヤンキー上がり', text: '気合いと根性はあるが、お笑いの基礎知識はゼロ。', neta: 1, hiraba: 5, pop: 2, relation: 40, money: 0 },
        { desc: '理屈屋なお笑いマニア', text: '高度なネタを書けそうだが、プライドが高く衝突しそうだ。', neta: 10, hiraba: 2, pop: 0, relation: 20, money: 0 },
        { desc: 'とにかく明るいギャガー', text: '場の空気を良くする天才だが、ネタの構成力は皆無。', neta: 1, hiraba: 10, pop: 5, relation: 60, money: 0 },
        { desc: '容姿端麗なアイドル気質', text: 'すでにファンがつきそうだが、お笑いへの熱量は未知数。', neta: 2, hiraba: 3, pop: 15, relation: 50, money: 0 },
        { desc: '元劇団員の演技派', text: 'コントの演技力はピカイチだが、平場のトークは弱そうだ。', neta: 8, hiraba: 2, pop: 3, relation: 50, money: 0 },
        { desc: '金遣いの荒いボンボン', text: '組めば活動資金を出してくれそうだが、ハングリー精神はない。', neta: 3, hiraba: 4, pop: 2, relation: 40, money: 10 },

    function getRandomName(gender) {
        let ln = lastNames[Math.floor(Math.random() * lastNames.length)];
        let fn = gender === '男' ? firstNamesMale[Math.floor(Math.random() * firstNamesMale.length)] : firstNamesFemale[Math.floor(Math.random() * firstNamesFemale.length)];
        return ln + ' ' + fn;
    }

    function getWeightedRandom(arr) {
        let totalWeight = arr.reduce((sum, item) => sum + item.weight, 0);
        let randomValue = Math.random() * totalWeight;
        for (let i = 0; i < arr.length; i++) {
            if (randomValue < arr[i].weight) return arr[i].name;
            randomValue -= arr[i].weight;
        }
        return arr[0].name;
    }

    function rollGacha() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-container').classList.remove('hidden');
        
        let gender = Math.random() < 0.7 ? '男' : '女';
        generatedMyName = getRandomName(gender);
        let pref = getWeightedRandom(prefectures);
        
        let eduRand = Math.random();
        let edu, special = '';
        specialBuffText = '';

        if (eduRand < 0.05) { 
            edu = '中学校 卒業'; globalAge = Math.floor(Math.random() * 3) + 16; 
            occupationText = '中学生'; initialMoney = 1;
        } else if (eduRand < 0.25) { 
            edu = '高等学校 卒業'; globalAge = Math.floor(Math.random() * 3) + 18; 
            if (Math.random() < 0.2) { special = '★ハイスクールマンザイ実績持ち'; specialBuffText = special; }

        } else if (eduRand < 0.50) { 
            edu = '専門学校 卒業'; globalAge = Math.floor(Math.random() * 3) + 20; 
            occupationText = Math.random() < 0.5 ? '専門生' : occupations[Math.floor(Math.random() * occupations.length)];
        } else if (eduRand < 0.95) { 
            edu = '大学 卒業'; globalAge = Math.floor(Math.random() * 4) + 22; 
            let r = Math.random();
            if (r < 0.1) { special = '★大学芸会実績持ち'; specialBuffText = special; }
            else if (r < 0.15) { special = '★トップ国立大卒'; specialBuffText = special; }
            occupationText = Math.random() < 0.4 ? '大学生' : occupations[Math.floor(Math.random() * occupations.length)];
        } else { 
            edu = '大学院 修了'; globalAge = Math.floor(Math.random() * 5) + 24; 
            occupationText = Math.random() < 0.2 ? '大学院生' : occupations[Math.floor(Math.random() * occupations.length)];
        }

        // 社会人の場合は10万〜100万円の貯金
        if (!['中学生', '高校生', '専門生', '大学生', '大学院生'].includes(occupationText)) {
            initialMoney = Math.floor(Math.random() * 91) + 10;
        } else {
            initialMoney = Math.floor(Math.random() * 5) + 2;
        }

        let specialHtml = special ? `<span class="special-buff">${special}</span>` : '';
        selectedFamily = getWeightedRandom(families);
        luckStat = Math.floor(Math.random() * 100) + 1;

        isDuo = Math.random() < 0.5;
        isInitialDuo = isDuo; 
        let admission = isDuo ? 'コンビ入学' : '単独入学（ピン）';
        hasCombi = isDuo;
        
        let partnerHtml = '';
        if (isDuo) {
            let pGender = Math.random() < 0.7 ? '男' : '女';
            partnerHtml = `<div class="form-row"><div class="form-label">相方氏名</div><div class="form-value">${getRandomName(pGender)} (${pGender})</div></div>
                           <div class="form-row"><div class="form-label">関係性</div><div class="form-value">${relationships[Math.floor(Math.random() * relationships.length)]}</div></div>`;

        } else {
            document.getElementById('naming-label').innerHTML = '希望する芸名 (任意)';
        }

        // 願書プレビューに「前職 / ステータス」を追加して描画
        document.getElementById('stats-content').innerHTML = `
            <div class="form-row" style="margin-bottom: 12px;">
                <div class="form-label" style="margin-top: 6px;">氏名</div>
                <div class="form-value name-value">${generatedMyName}</div>
            </div>
            <div class="form-row"><div class="form-label">出身地</div><div class="form-value">${pref}</div></div>
            <div class="form-row"><div class="form-label">前職 / 属性</div><div class="form-value" style="font-weight:bold; color:#d95319;">${occupationText}</div></div>
            <div class="form-row"><div class="form-label">最終学歴</div><div class="form-value">${edu} ${specialHtml}</div></div>
            <div class="form-row"><div class="form-label">年齢</div><div class="form-value">${globalAge}歳</div></div>
            <div class="form-row"><div class="form-label">実家の太さ</div><div class="form-value">${selectedFamily}</div></div>
            <div style="border-top: 1px dashed #ccc; margin: 12px 0;"></div>
            <div class="form-row"><div class="form-label">入学形態</div><div class="form-value" style="font-weight: bold;">${admission}</div></div>
            ${partnerHtml}
        `;
    }

    function submitForm() {
        let inputName = document.getElementById('name-input').value.trim();
        if (inputName !== '') {
            finalCombiName = inputName;
        } else {
            if (isDuo) {
                if (Math.random() < 0.7) {
                    finalCombiName = namePart1[Math.floor(Math.random() * namePart1.length)] + namePart2[Math.floor(Math.random() * namePart2.length)];
                } else {
                    finalCombiName = singleNames[Math.floor(Math.random() * singleNames.length)];
                }
            } else {
                finalCombiName = generatedMyName;
            }
        }

        document.getElementById('game-container').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-announcement').innerText = (isDuo ? 'コンビ「' : 'ピン芸人「') + finalCombiName + '」として登録完了';
    }

    function addHistory(text) {
        let timeStr = currentYearNumber === 0 ? `NSC ${currentMonth}月` : `${currentYearNumber}年目 ${currentMonth}月`;
        historyLog.push({ date: timeStr, text: text });
        renderHistory();
    }

    function renderHistory() {
        let html = '';
        historyLog.forEach(log => {
            html += `<div class="history-entry"><span class="history-date">[${log.date}]</span> ${log.text}</div>`;
        });
        let contentDiv = document.getElementById('history-content');
        contentDiv.innerHTML = html;
        let areaDiv = document.getElementById('history-area');
        areaDiv.scrollTop = areaDiv.scrollHeight;
    }

    function updateUI() {
        let timeLabel = currentYearNumber === 0 ? `NSC ${currentMonth}月` : `${currentYearNumber}年目 ${currentMonth}月`;
        document.getElementById('ui-time-label').innerText = timeLabel;
        document.getElementById('ui-age').innerText = globalAge;
        document.getElementById('ui-combi-name').innerText = finalCombiName;

        let durationText = 'ピン活動中';
        if (hasCombi) {
            let y = Math.floor(combiMonths / 12);
            let m = combiMonths % 12;
            durationText = `結成:${y}年${m}ヶ月(${comedyStyle})`;
            if (y >= 14) {
                durationText = `<span style="color:#e74c3c;">結成:${y}年(M-1限界)</span>`;
            }
        }
        document.getElementById('ui-combi-duration').innerHTML = durationText;

        document.getElementById('ui-money').innerText = stats.money;
        document.getElementById('ui-stamina').innerText = stats.stamina;
        document.getElementById('ui-neta').innerText = stats.neta;
        document.getElementById('ui-hiraba').innerText = stats.hiraba;
        document.getElementById('ui-pop').innerText = stats.pop;
        
        if (hasCombi) {
            document.getElementById('ui-relation-box').classList.remove('hidden');
            document.getElementById('ui-relation').innerText = stats.relation;
        } else {
            document.getElementById('ui-relation-box').classList.add('hidden');
        }
    }

    function setStory(text) {
        document.getElementById('story-area').innerHTML = text;
    }

    function setChoices(choices) {
        let area = document.getElementById('choices-area');
        area.innerHTML = '';
        choices.forEach(choice => {
            let btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice.text;
            btn.onclick = choice.action;
            area.appendChild(btn);
        });
    }

    function startGame() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');

        stats.money = initialMoney; // 前職の貯金や初期資金を反映
        currentYearNumber = 0; // NSC時代
        currentMonth = 4;

        addHistory('NSCに入学した。');
        updateUI();

        if (hasCombi) {
            addHistory(`コンビ『${finalCombiName}』として活動開始。`);
            startStyleSelection(); 
        } else {
            addHistory('ピン芸人として活動開始。');
            startSoloEvent();
        }
    }

    function startStyleSelection() {
        setStory(`コンビの活動スタイルを決定してください。`);
        setChoices([
            {
                text: '漫才',
                action: () => {
                    comedyStyle = '漫才';
                    addHistory('活動スタイルを「漫才」に決定した。');
                    updateUI();
                    startAutoPerformance();
                }
            },
            {
                text: 'コント',
                action: () => {
                    comedyStyle = 'コント';
                    addHistory('活動スタイルを「コント」に決定した。');
                    updateUI();
                    startAutoPerformance();
                }
            },
            {
                text: 'どちらも',
                action: () => {
                    comedyStyle = 'どちらも';
                    addHistory('活動スタイルを「二刀流」に決定した。');
                    updateUI();
                    startAutoPerformance();
                }
            }
        ]);
    }

    function startAutoPerformance() {
        setStory(`NSCでの初めての授業。数日後には講師陣の前での初ネタ見せが控えている。<br>相方と放課後に徹底的にネタを合わせた。`);
        
        stats.neta += 10;
        stats.stamina -= 15;
        updateUI();

        setChoices([
            {
                text: '初ネタ見せの本番を迎える',
                action: () => {
                    let score = stats.neta + Math.floor(Math.random() * 10);
                    let resultText = score > 15 ? "講師陣から高評価を受けた！" : "緊張で噛んでしまい、厳しいダメ出しを食らった…。";
                    if (score > 15) stats.pop += 2;

                    addHistory('初ネタ見せの本番を終えた。');
                    updateUI();

                    setStory(`緊張の初ネタ見せ本番。<br>${resultText}<br><br>こうして、NSCでの過酷な日々が幕を開けた。`);
                    
                    setChoices([
                        {
                            text: 'NSCの生活を進める',
                            action: () => {
                                advanceMonth(); 
                            }
                        }
                    ]);
                }
            }
        ]);
    }

    // --- 毎月のループ進行エンジン ---
    function advanceMonth() {
        if (currentMonth === 4) {
            startYearlyPolicySelection();
            return;
        }

        if (currentMonth === 3) {
            if (hasCombi) {
                let yearlyDissolveRate = isInitialDuo ? 0.05 : 0.40; 
                if (Math.random() < yearlyDissolveRate) {
                    hasCombi = false;
                    addHistory(`方向性の違いから、3月を迎えるタイミングでコンビ『${finalCombiName}』が解散…。`);
                    setStory(`【解散の危機】<br>年度末の話し合いの末、ついに相方と解散することになってしまった…。再びピン芸人として活動を続けます。`);
                    updateUI();
                    setChoices([
                        {
                            text: 'ピンとして活動を続ける',
                            action: () => { finishMarchTransition(); }
                        }
                    ]);
                    return;
                }
            }
            finishMarchTransition();
            return;
        }

        currentMonth++;
        if (hasCombi) combiMonths++;

        if (currentMonth === 7 && !hasCombi) {
            startSecondSoloEvent();
            return;
        }

        let timeStr = currentYearNumber === 0 ? `NSC ${currentMonth}月` : `${currentYearNumber}年目 ${currentMonth}月`;
        setStory(`【${timeStr}】<br>今月は何に注力しますか？`);
        setChoices([
            {
                text: 'ネタ合わせに励む（ネタ力UP / 体力微減）',
                action: () => {
                    stats.neta += 3;
                    stats.stamina -= 10;
                    addHistory(`${currentMonth}月：ネタ合わせに励んだ。`);
                    updateUI();
                    advanceMonth();
                }
            },
            {
                text: '相方と飲みに行く（コンビ仲UP / 資金消費）',
                action: () => {
                    if (!hasCombi) {
                        alert("現在相方がいません！");
                        advanceMonth();
                        return;
                    }
                    if (stats.money >= 1) {
                        stats.money -= 1;
                        stats.relation = Math.min(100, stats.relation + 10);
                        addHistory(`${currentMonth}月：相方と飲みに行き、絆を深めた。`);
                        updateUI();
                        advanceMonth();
                    } else {
                        alert("資金が足りません！");
                        advanceMonth();
                    }
                }
            }
        ]);
    }

    // --- 4月の年間方針選択 ---
    function startYearlyPolicySelection() {
        let timeStr = currentYearNumber === 0 ? `NSC 4月` : `${currentYearNumber}年目 4月`;
        setStory(`【${timeStr}：年間方針の決定】<br>今年1年間、どのような生活スタイルで芸人活動を行いますか？`);
        setChoices([
            {
                text: 'ネタに注力（ほとんどバイトしない / ネタ力大幅UP・資金大幅減）',
                action: () => {
                    stats.neta += 8;
                    stats.money -= 4; 
                    if (stats.money < 0) addHistory('生活費が足りず、借金生活に突入した…。');
                    addHistory('年間方針：ネタに注力（バイトをほぼせずネタを磨く）');
                    updateUI();
                    advanceMonthAfterPolicy();
                }
            },
            {
                text: 'バイトとネタ半分ずつ（バランス型 / ネタ力小UP・資金維持）',
                action: () => {
                    stats.neta += 4;
                    stats.money += 2;
                    addHistory('年間方針：バイトとネタを両立');
                    updateUI();
                    advanceMonthAfterPolicy();
                }
            },
            {
                text: 'とにかく生活の安定（バイト多め / 資金増・ネタ力停滞）',
                action: () => {
                    stats.money += 6;
                    addHistory('年間方針：バイト多めで生活の安定を図る');
                    updateUI();
                    advanceMonthAfterPolicy();
                }
            }
        ]);
    }

    function advanceMonthAfterPolicy() {
        currentMonth++;
        if (hasCombi) combiMonths++;
        let timeStr = currentYearNumber === 0 ? `NSC ${currentMonth}月` : `${currentYearNumber}年目 ${currentMonth}月`;
        setStory(`【${timeStr}】<br>方針を決めて新たな1ヶ月が始まった。今月は何をしますか？`);
        setChoices([
            {
                text: 'ネタ合わせに励む',
                action: () => { stats.neta += 3; stats.stamina -= 10; addHistory(`${currentMonth}月：ネタ合わせに励んだ。`); updateUI(); advanceMonth(); }
            },
            {
                text: '相方と飲みに行く',
                action: () => { 
                    if (!hasCombi) { advanceMonth(); return; }
                    if (stats.money >= 1) { stats.money -= 1; stats.relation = Math.min(100, stats.relation + 10); addHistory(`${currentMonth}月：相方と飲んだ。`); updateUI(); advanceMonth(); }
                    else { alert("資金不足！"); advanceMonth(); }
                }
            }
        ]);
    }

    function finishMarchTransition() {
        if (currentYearNumber === 0) {
            currentMonth = 4;
            currentYearNumber = 1; // 1年目へ昇格
            globalAge++;
            startBigLive();
        } else {
            currentMonth = 4;
            currentYearNumber++;
            globalAge++;
            startYearlyPolicySelection();
        }
    }

    function startSecondSoloEvent() {
        setStory(`【7月・夏前】<br>ピンとして活動していたあなたに、同期から「そろそろコンビ組まないか？」と声がかかる時期がやってきた。<br>相方探しの会に参加してみよう。`);
        setChoices([
            {
                text: '2回目相方探しの会に参加する',
                action: () => {
                    let shuffledArchetypes = [...partnerArchetypes].sort(() => 0.5 - Math.random());
                    let candidates = shuffledArchetypes.slice(0, 3);
                    let candidatesHtml = candidates.map((c, i) => `<strong>候補${i+1}: ${c.desc}</strong><br><span style="font-size:0.85em;color:#555;">${c.text}</span>`).join('<br><br>');
                    
                    setStory(`2回目相方探しの会には、まだコンビが決まっていない個性豊かな同期が集まっている。<br><br>${candidatesHtml}<br><br>誰と組みますか？`);
                    
                    let newChoices = candidates.map((c, i) => {
                        return {
                            text: `候補${i+1}（${c.desc}）と組む`,
                            action: () => {
                                let pGender = Math.random() < 0.7 ? '男' : '女';
                                let pName = getRandomName(pGender);
                                
                                hasCombi = true;
                                combiMonths = 0;
                                stats.neta += c.neta;
                                stats.hiraba += c.hiraba;
                                stats.pop += c.pop;
                                stats.relation = c.relation;
                                stats.money += c.money;
                                
                                if (Math.random() < 0.7) {
                                    finalCombiName = namePart1[Math.floor(Math.random() * namePart1.length)] + namePart2[Math.floor(Math.random() * namePart2.length)];
                                } else {
                                    finalCombiName = singleNames[Math.floor(Math.random() * singleNames.length)];
                                }

                                addHistory(`7月：夏前の相方探しで「${c.desc}」の${pName}と新コンビ『${finalCombiName}』を結成した。`);
                                updateUI();
                                startStyleSelection(); 
                            }
                        }
                    });
                    
                    newChoices.push({
                        text: 'やはりピンを貫く',
                        action: () => {
                            addHistory('7月：相方探しの会を見送り、ピン活動を継続した。');
                            advanceMonth();
                        }
                    });

                    setChoices(newChoices);
                }
            }
        ]);
    }

    function startBigLive() {
        setStory(`ついにNSC卒業の4月がやってきた。<br>総決算として250組が参加する卒業ライブ「大ライブ」の本番を迎える！`);
        
        setChoices([
            {
                text: '大ライブのステージに全力で挑む',
                action: () => {
                    let baseScore = (stats.neta * 2) + (stats.hiraba * 1.5) + luckStat;
                    if (isInitialDuo) baseScore += 20; 
                    if (specialBuffText !== '') baseScore += 15; 

                    let randomFactor = Math.floor(Math.random() * 50);
                    let calculatedRank = Math.max(1, 250 - Math.floor(baseScore + randomFactor));

                    addHistory(`大ライブに参加。250組中「第${calculatedRank}位」となった！`);
                    updateUI();

                    let resultComment = "";
                    if (calculatedRank <= 3) {
                        resultComment = "なんと上位入賞を果たし、事務所の即戦力として大注目を浴びた！最高すべりだしだ！";
                    } else if (calculatedRank <= 30) {
                        resultComment = "上位に食い込み、劇場の若手枠への切符を掴み取った！";
                    } else {
                        resultComment = "健闘したものの、上位の壁は厚く悔しい結果に終わった…。ここから這い上がるしかない！";
                    }

                    setStory(`【大ライブ結果発表】<br>参加250組中……<br><br><span style="font-size:1.4em; color:#d95319; font-weight:bold;">第 ${calculatedRank} 位</span><br><br>${resultComment}`);

                    setChoices([
                        {
                            text: '1年目（プロフェッショナル編）へ進む',
                            action: () => {
                                startYearlyPolicySelection(); 
                            }
                        }
                    ]);
                }
            }
        ]);
    }

    function startSoloEvent() {
        setStory(`NSCでの授業が始まった。<br>周囲はすでにコンビを組んでネタ見せの準備をしている。<br>ピン芸人として入学した自分は、相方探しの会に参加するか決める必要がある。`);
        
        setChoices([
            {
                text: '相方探しの会に参加して相方を探す',
                action: () => {
                    let shuffledArchetypes = [...partnerArchetypes].sort(() => 0.5 - Math.random());
                    let candidates = shuffledArchetypes.slice(0, 3);
                    let candidatesHtml = candidates.map((c, i) => `<strong>候補${i+1}: ${c.desc}</strong><br><span style="font-size:0.85em;color:#555;">${c.text}</span>`).join('<br><br>');
                    
                    setStory(`相方探しの会に参加した。<br>${candidatesHtml}<br><br>誰と組みますか？`);
                    
                    let newChoices = candidates.map((c, i) => {
                        return {
                            text: `候補${i+1}（${c.desc}）と組む`,
                            action: () => {
                                let pGender = Math.random() < 0.7 ? '男' : '女';
                                let pName = getRandomName(pGender);
                                
                                hasCombi = true;
                                combiMonths = 0;
                                stats.neta += c.neta;
                                stats.hiraba += c.hiraba;
                                stats.pop += c.pop;
                                stats.relation = c.relation;
                                stats.money += c.money;
                                
                                if (Math.random() < 0.7) {
                                    finalCombiName = namePart1[Math.floor(Math.random() * namePart1.length)] + namePart2[Math.floor(Math.random() * namePart2.length)];
                                } else {
                                    finalCombiName = singleNames[Math.floor(Math.random() * singleNames.length)];
                                }

                                addHistory(`「${c.desc}」の${pName}とコンビ『${finalCombiName}』を結成した。`);
                                updateUI();
                                startStyleSelection(); 
                            }
                        }
                    });
                    
                    newChoices.push({
                        text: 'やっぱり見送る（ピン活動継続）',
                        action: () => {
                            addHistory('相方探しを見送った。');
                            advanceMonth();
                        }
                    });

                    setChoices(newChoices);
                }
            },
            {
                text: 'ひとまずピンでネタ作りに集中する（ネタ力UP）',
                action: () => {
                    stats.neta += 10;
                    stats.stamina -= 20;
                    addHistory('相方探しよりもネタ作りに没頭した。');
                    updateUI();
                    setStory(`1人で黙々とネタを書いた。ネタ力が少し上がったが、体力を使った。`);
                    setChoices([
                        { text: '次の月へ進む', action: () => { advanceMonth(); } }
                    ]);
                }
            }
        ]);
    }
</script>
</html>
