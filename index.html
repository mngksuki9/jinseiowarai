<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>芸人ガチャ ＜よしもと＞</title>
<style>
    /* 全体のデザイン（ノート風の背景） */
    body {
        background-color: #f0f2f5;
        background-image: linear-gradient(transparent 95%, #e1e5ea 5%);
        background-size: 100% 1.5em;
        color: #333;
        font-family: "Yu Mincho", "MS Mincho", "Hiragino Mincho ProN", serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    /* 願書・メイン画面のコンテナ */
    #game-container, #main-screen {
        background-color: #ffffff;
        width: 100%;
        max-width: 500px;
        padding: 30px 20px;
        border: 2px solid #2c3e50;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    #game-container::before, #main-screen::before {
        content: "";
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 1px solid #2c3e50;
        pointer-events: none;
    }

    /* タイトル・スタンプ等の既存CSS */
    .form-title {
        color: #2c3e50;
        font-size: 1.6em;
        letter-spacing: 0.3em;
        margin-top: 0;
        margin-bottom: 30px;
        border-bottom: 1px solid #2c3e50;
        padding-bottom: 10px;
        display: inline-block;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
    }
    .stamp {
        position: absolute;
        top: 20px; right: 20px;
        width: 60px; height: 60px;
        border: 2px solid #d9534f;
        border-radius: 50%;
        color: #d9534f;
        font-weight: bold; font-size: 0.9em;
        display: flex; align-items: center; justify-content: center;
        text-align: center; line-height: 1.2;
        transform: rotate(15deg); opacity: 0.8;
    }
    .form-row { display: flex; margin-bottom: 15px; align-items: baseline; }
    .form-label { width: 130px; font-size: 0.85em; color: #666; flex-shrink: 0; }
    .form-value { font-size: 1.05em; color: #111; flex-grow: 1; }
    .name-value { font-size: 1.5em; letter-spacing: 0.1em; }
    .special-buff { color: #d95319; font-size: 0.8em; display: block; font-weight: bold; margin-top: 3px; font-family: 'Helvetica Neue', Arial, sans-serif; }
    
    input[type="text"] {
        font-family: "Yu Mincho", "MS Mincho", serif; font-size: 1em; padding: 8px;
        border: 1px solid #ccc; border-radius: 3px; width: 90%; background-color: #fafafa;
    }
    input[type="text"]:focus { border-color: #2c3e50; outline: none; background-color: #fff; }

    .btn-area { text-align: center; margin-top: 30px; font-family: 'Helvetica Neue', Arial, sans-serif; }
    button {
        background-color: #2c3e50; color: #ffffff; border: none;
        padding: 12px 24px; font-size: 1em; border-radius: 4px;
        cursor: pointer; transition: background-color 0.2s, transform 0.1s;
        margin: 5px;
    }
    button:hover { background-color: #1a252f; }
    button:active { transform: scale(0.98); }
    
    /* メインゲーム用の追加CSS */
    #status-bar {
        background-color: #2c3e50; color: #fff; padding: 10px; border-radius: 4px;
        font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 0.85em;
        display: flex; flex-wrap: wrap; justify-content: space-between; margin-bottom: 20px;
    }
    .status-item { width: 30%; margin-bottom: 5px; }
    .status-item span { color: #f39c12; font-weight: bold; font-size: 1.2em; }
    
    /* ヘッダー情報（時間・年齢・コンビ歴） */
    .status-header { 
        width: 100%; font-size: 1.1em; font-weight: bold; margin-bottom: 10px; 
        color: #f0f2f5; border-bottom: 1px solid #555; padding-bottom: 5px;
        display: flex; justify-content: space-between;
    }
    
    #story-area {
        background-color: #fafafa; padding: 20px; border: 1px solid #ccc; border-radius: 4px;
        min-height: 120px; font-size: 1.1em; line-height: 1.8; margin-bottom: 20px;
    }
    #choices-area { display: flex; flex-direction: column; gap: 10px; font-family: 'Helvetica Neue', Arial, sans-serif; }
    .choice-btn { background-color: #d95319; font-weight: bold; }
    .choice-btn:hover { background-color: #bf4310; }

    /* 履歴ログエリア */
    #history-area {
        margin-top: 25px;
        padding: 15px;
        background-color: #1a252f;
        color: #ecf0f1;
        border-radius: 4px;
        height: 150px;
        overflow-y: auto;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 0.9em;
        border: 2px solid #ccc;
    }
    .history-entry {
        margin-bottom: 6px;
        border-bottom: 1px dotted #7f8c8d;
        padding-bottom: 4px;
    }
    .history-entry:last-child {
        border-bottom: none;
    }
    .history-date {
        color: #f39c12;
        font-weight: bold;
        margin-right: 10px;
    }

    .hidden { display: none !important; }
</style>
</head>
<body>

<!-- スタート画面 -->
<div id="start-screen" style="text-align: center; max-width: 450px; margin-top: 50px; font-family: 'Helvetica Neue', Arial, sans-serif;">
    <h1 style="color: #2c3e50;">芸人ガチャ <span style="color:#d95319;">＜よしもと＞</span></h1>
    <p style="color: #555; line-height: 1.6;">笑える人生になるかはあなた次第。<br>あなたの芸人人生は、ここから決まります。</p>
    <button onclick="rollGacha()" style="margin-top: 20px;">NSC願書を作成する</button>
</div>

<!-- 願書画面 -->
<div id="game-container" class="hidden">
    <div class="stamp">NSC<br>作成中</div>
    <div class="form-title">入 学 願 書</div>
    <div id="stats-content"></div>
    <div id="naming-area" style="border-top: 2px solid #2c3e50; margin-top: 25px; padding-top: 20px;">
        <div class="form-row">
            <div class="form-label" id="naming-label" style="font-weight: bold; color: #2c3e50;">コンビ名<br><span style="font-size: 0.8em; font-weight: normal;">(任意)</span></div>
            <div class="form-value"><input type="text" id="name-input" placeholder="未入力で自動生成されます"></div>
        </div>
        <div class="btn-area"><button onclick="submitForm()">この内容で願書を提出する</button></div>
    </div>
</div>

<!-- 提出完了画面 -->
<div id="result-screen" class="hidden" style="text-align: center; max-width: 450px; margin-top: 50px; font-family: 'Helvetica Neue', Arial, sans-serif; background: #fff; padding: 40px 20px; border: 2px solid #2c3e50; position: relative;">
    <div class="stamp" style="border-color: #5cb85c; color: #5cb85c; transform: rotate(-10deg);">受理済</div>
    <h2 style="color: #2c3e50;">願書を受理しました</h2>
    <p id="final-announcement" style="font-size: 1.2em; font-weight: bold; color: #d95319; margin: 30px 0;"></p>
    <button onclick="startGame()" style="margin-top: 20px;">1年目を開始する</button>
</div>

<!-- メインゲーム画面 -->
<div id="main-screen" class="hidden">
    <!-- ステータスバー -->
    <div id="status-bar">
        <div class="status-header">
            <span><span id="ui-year">1</span>年目 <span id="ui-month">4</span>月 (<span id="ui-age">22</span>歳)</span>
            <span id="ui-combi-name" style="color:#f39c12;"></span>
            <span id="ui-combi-duration" style="font-size:0.9em; font-weight:normal;">結成: 0年0ヶ月</span>
        </div>
        <div class="status-item">資金: <span id="ui-money">0</span>万</div>
        <div class="status-item">体力: <span id="ui-stamina">100</span></div>
        <div class="status-item">ネタ力: <span id="ui-neta">5</span></div>
        <div class="status-item">平場力: <span id="ui-hiraba">5</span></div>
        <div class="status-item">人気: <span id="ui-pop">0</span></div>
        <div class="status-item" id="ui-relation-box">コンビ仲: <span id="ui-relation">50</span></div>
    </div>
    
    <!-- テキストエリア -->
    <div id="story-area">
        ここにテキストが表示されます。
    </div>

    <!-- 選択肢エリア -->
    <div id="choices-area">
        <!-- ボタンが動的に追加されます -->
    </div>

    <!-- 履歴エリア -->
    <div id="history-area">
        <div style="color: #bdc3c7; margin-bottom: 10px; font-weight: bold; font-size: 1.1em;">▼ 芸人人生の記録</div>
        <div id="history-content"></div>
    </div>
</div>

<script>
    // --- 初期データ ---
    let isDuo = false;
    let generatedMyName = '';
    let finalCombiName = '';
    let selectedFamily = '';
    let luckStat = 50;
    let globalAge = 20;

    // 進行・ステータスデータ
    let currentYear = 1;
    let currentMonth = 4;
    let combiMonths = 0;
    let hasCombi = false;
    let stats = { money: 0, stamina: 100, neta: 5, hiraba: 5, pop: 0, relation: 50 };
    let historyLog = [];

    const lastNames = ['佐藤', '鈴木', '高橋', '田中', '伊藤', '渡辺', '山本', '中村', '小林', '加藤', '吉田', '山田', '松本', '浜田', '石田', '山口', '斎藤', '木村', '林', '清水', '山崎', '池田', '阿部', '森', '橋本'];
    const firstNamesMale = ['翔太', '大輝', '健太', '拓海', '翼', '蓮', '真', '大輔', '隆史', '和也', '樹', '湊'];
    const firstNamesFemale = ['さくら', '結衣', '陽菜', '莉子', '美咲', 'あおい', '楓', '七海', '愛', '瞳'];
    
    const prefectures = [
        {name: '大阪府', weight: 25}, {name: '東京都', weight: 20}, {name: '兵庫県', weight: 10}, {name: '京都府', weight: 10},
        {name: '神奈川県', weight: 8}, {name: '埼玉県', weight: 8}, {name: '福岡県', weight: 6}, {name: '北海道', weight: 4},
        {name: '青森県', weight: 1}, {name: '沖縄県', weight: 2}
    ];

    const families = [
        {name: '普通の家庭', weight: 45}, {name: '中流家庭', weight: 25},
        {name: '貧乏（奨学金とバイト頼り）', weight: 23}, {name: 'その日暮らしの極貧', weight: 5},
        {name: '超裕福（仕送り月30万）', weight: 2}
    ];

    const relationships = ['高校の同級生', '幼なじみ', '大学お笑いサークルの先輩後輩', 'バイト先の同僚'];
    const namePart1 = ['鉄骨', '東京', '電脳', '爆笑', '真空', '純白', 'マッハ', 'ミラクル'];
    const namePart2 = ['チェリー', 'モグラ', 'ダイナマイツ', 'ボーイズ', 'ジェシカ', 'サンダー', '太郎', '弁当'];
    const singleNames = ['末脚自慢', 'タスカータソルテ', 'メトロノーム', '蜃気楼', '蛍光灯', 'ヴェルトライゼンデ', '少年の詩', 'デュランダル'];

    function getRandomName(gender) {
        let ln = lastNames[Math.floor(Math.random() * lastNames.length)];
        let fn = gender === '男' ? firstNamesMale[Math.floor(Math.random() * firstNamesMale.length)] : firstNamesFemale[Math.floor(Math.random() * firstNamesFemale.length)];
        return ln + ' ' + fn;
    }

    function getWeightedRandom(arr) {
        let totalWeight = arr.reduce((sum, item) => sum + item.weight, 0);
        let randomValue = Math.random() * totalWeight;
        for (let i = 0; i < arr.length; i++) {
            if (randomValue < arr[i].weight) return arr[i].name;
            randomValue -= arr[i].weight;
        }
        return arr[0].name;
    }

    function rollGacha() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-container').classList.remove('hidden');
        
        let gender = Math.random() < 0.7 ? '男' : '女';
        generatedMyName = getRandomName(gender);
        let pref = getWeightedRandom(prefectures);
        
        let eduRand = Math.random();
        let edu, special = '';
        if (eduRand < 0.05) { edu = '中学校 卒業'; globalAge = Math.floor(Math.random() * 3) + 16; } 
        else if (eduRand < 0.25) { edu = '高等学校 卒業'; globalAge = Math.floor(Math.random() * 3) + 18; } 
        else if (eduRand < 0.50) { edu = '専門学校 卒業'; globalAge = Math.floor(Math.random() * 3) + 20; } 
        else if (eduRand < 0.95) { edu = '大学 卒業'; globalAge = Math.floor(Math.random() * 4) + 22; } 
        else { edu = '大学院 修了'; globalAge = Math.floor(Math.random() * 5) + 24; }

        selectedFamily = getWeightedRandom(families);
        luckStat = Math.floor(Math.random() * 100) + 1;

        isDuo = Math.random() < 0.5;
        let admission = isDuo ? 'コンビ入学' : '単独入学（ピン）';
        hasCombi = isDuo;
        
        let partnerHtml = '';
        if (isDuo) {
            let pGender = Math.random() < 0.7 ? '男' : '女';
            partnerHtml = `<div class="form-row"><div class="form-label">相方氏名</div><div class="form-value">${getRandomName(pGender)} (${pGender})</div></div>`;
            document.getElementById('naming-label').innerHTML = 'コンビ名<br><span style="font-size: 0.8em; font-weight: normal;">(任意)</span>';
        } else {
            document.getElementById('naming-label').innerHTML = '希望する芸名<br><span style="font-size: 0.8em; font-weight: normal;">(任意)</span>';
        }

        document.getElementById('stats-content').innerHTML = `
            <div class="form-row"><div class="form-label">氏名</div><div class="form-value name-value">${generatedMyName}</div></div>
            <div class="form-row"><div class="form-label">出身地</div><div class="form-value">${pref}</div></div>
            <div class="form-row"><div class="form-label">年齢</div><div class="form-value">${globalAge}歳</div></div>
            <div class="form-row"><div class="form-label">実家の太さ</div><div class="form-value">${selectedFamily}</div></div>
            <div class="form-row"><div class="form-label">入学形態</div><div class="form-value" style="font-weight: bold;">${admission}</div></div>
            ${partnerHtml}
        `;
    }

    function submitForm() {
        let inputName = document.getElementById('name-input').value.trim();
        if (inputName !== '') {
            finalCombiName = inputName;
        } else {
            if (isDuo) {
                if (Math.random() < 0.7) finalCombiName = namePart1[Math.floor(Math.random() * namePart1.length)] + namePart2[Math.floor(Math.random() * namePart2.length)];
                else finalCombiName = singleNames[Math.floor(Math.random() * singleNames.length)];
            } else {
                finalCombiName = generatedMyName;
            }
        }

        document.getElementById('game-container').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-announcement').innerText = (isDuo ? 'コンビ「' : 'ピン芸人「') + finalCombiName + '」として登録完了';
    }

    // --- メインゲーム進行ロジック ---
    
    function addHistory(text) {
        let dateStr = `${currentYear}年目 ${currentMonth}月`;
        historyLog.push({ date: dateStr, text: text });
        renderHistory();
    }

    function renderHistory() {
        let html = '';
        // 最新のものが一番下に追加されていくので、そのままループ
        historyLog.forEach(log => {
            html += `<div class="history-entry"><span class="history-date">[${log.date}]</span> ${log.text}</div>`;
        });
        let contentDiv = document.getElementById('history-content');
        contentDiv.innerHTML = html;
        // 自動で一番下までスクロール
        let areaDiv = document.getElementById('history-area');
        areaDiv.scrollTop = areaDiv.scrollHeight;
    }

    function updateUI() {
        document.getElementById('ui-year').innerText = currentYear;
        document.getElementById('ui-month').innerText = currentMonth;
        document.getElementById('ui-age').innerText = globalAge;
        document.getElementById('ui-combi-name').innerText = finalCombiName;

        let durationText = 'ピン活動中';
        if (hasCombi) {
            let y = Math.floor(combiMonths / 12);
            let m = combiMonths % 12;
            durationText = `結成: ${y}年${m}ヶ月`;
            // M-1ラストイヤー警告
            if (y >= 14) {
                durationText = `<span style="color:#e74c3c;">結成: ${y}年${m}ヶ月 (M-1ラストイヤー間近)</span>`;
            }
        }
        document.getElementById('ui-combi-duration').innerHTML = durationText;

        document.getElementById('ui-money').innerText = stats.money;
        document.getElementById('ui-stamina').innerText = stats.stamina;
        document.getElementById('ui-neta').innerText = stats.neta;
        document.getElementById('ui-hiraba').innerText = stats.hiraba;
        document.getElementById('ui-pop').innerText = stats.pop;
        
        if (hasCombi) {
            document.getElementById('ui-relation-box').classList.remove('hidden');
            document.getElementById('ui-relation').innerText = stats.relation;
        } else {
            document.getElementById('ui-relation-box').classList.add('hidden');
        }
    }

    function setStory(text) {
        document.getElementById('story-area').innerHTML = text;
    }

    function setChoices(choices) {
        let area = document.getElementById('choices-area');
        area.innerHTML = '';
        choices.forEach(choice => {
            let btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice.text;
            btn.onclick = choice.action;
            area.appendChild(btn);
        });
    }

    // 1年目スタート
    function startGame() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');

        if (selectedFamily.includes('超裕福')) stats.money = 50;
        else if (selectedFamily.includes('中流家庭')) stats.money = 15;
        else if (selectedFamily.includes('極貧')) stats.money = 1;
        else stats.money = 5; 
        
        addHistory('NSCに入学した。');
        if (hasCombi) {
            addHistory(`コンビ『${finalCombiName}』として活動開始。`);
        } else {
            addHistory('ピン芸人として活動開始。');
        }

        updateUI();

        if (hasCombi) {
            startDuoEvent();
        } else {
            startSoloEvent();
        }
    }

    // ピン芸人ルート：最初のイベント
    function startSoloEvent() {
        setStory(`NSCでの授業が始まった。<br>周囲はすでにコンビを組んでネタ見せの準備をしている。<br>ピン芸人として入学した自分は、まずは相方を探すための相方探しの会に参加するかどうかを決めなければならない。`);
        
        setChoices([
            {
                text: '相方探しの会に参加して相方を探す',
                action: () => {
                    setStory(`相方探しの会に参加した。<br>声のデカいヤンキー上がりの同期と、やたらお笑い理論を語る理屈っぽい同期が余っているようだ。妥協して組みますか？`);
                    setChoices([
                        { text: '妥協して組む（ネタ力微増、コンビ仲低スタート）', action: () => {
                            hasCombi = true;
                            combiMonths = 0;
                            stats.relation = 20;
                            stats.neta += 5;
                            finalCombiName = '同期との即席コンビ';
                            addHistory(`同期と妥協してコンビ『${finalCombiName}』を結成した。`);
                            updateUI();
                            alert('とりあえずコンビを結成した！(以降の月へ進みます)');
                        } },
                        { text: '見送る（ピン活動継続）', action: () => {
                            addHistory('相方探し相方探しの会を見送った。');
                            alert('今回は見送った。ピンとしてネタ作りを始める。'); 
                        } }
                    ]);
                }
            },
            {
                text: 'ひとまずピンでネタ作りに集中する（ネタ力UP）',
                action: () => {
                    stats.neta += 10;
                    stats.stamina -= 20;
                    addHistory('相方探しよりもネタ作りに没頭した。');
                    updateUI();
                    setStory(`1人で黙々とネタを書いた。ネタ力が少し上がったが、体力を使った。<br>このままピン芸人として初回のネタ見せに挑むことになりそうだ。`);
                    setChoices([
                        { text: '次の月へ進む', action: () => alert('次へ(実装予定)') }
                    ]);
                }
            }
        ]);
    }

    // コンビルート：最初のイベント
    function startDuoEvent() {
        setStory(`NSCでの初めての授業。数日後には講師陣の前での初ネタ見せが控えている。<br>相方と放課後にどうやって過ごすかで、今後の方向性が決まりそうだ。`);
        
        setChoices([
            {
                text: '壁に向かって徹底的にネタを合わせる（ネタ力UP / 体力消費大）',
                action: () => {
                    stats.neta += 15;
                    stats.stamina -= 30;
                    addHistory('初ネタ見せに向けて激しいネタ合わせを行った。');
                    updateUI();
                    setStory(`相方と何度も何度もネタを合わせた。声のトーンから間の取り方まで徹底的に調整したため、ネタの完成度は上がったがひどく疲弊した。`);
                    setChoices([{ text: 'ネタ見せ本番へ', action: () => alert('いざ本番！(実装予定)') }]);
                }
            },
            {
                text: '飲みに行ってコンビの絆を深める（コンビ仲UP / 資金消費）',
                action: () => {
                    if (stats.money >= 1) {
                        stats.relation += 10;
                        stats.money -= 1;
                        addHistory('相方と飲みに行き、お互いの絆を深めた。');
                        updateUI();
                        setStory(`近くの居酒屋で相方と酒を交わし、お笑いへの熱い想いを語り合った。コンビの結束は強まったが、ネタの練習は全くできていない。`);
                        setChoices([{ text: 'ネタ見せ本番へ', action: () => alert('練習不足のまま本番へ…(実装予定)') }]);
                    } else {
                        alert("資金が足りません！");
                    }
                }
            },
            {
