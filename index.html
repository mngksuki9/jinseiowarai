<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>芸人ガチャ ＜よしもと＞</title>
<style>
    /* 全体のデザイン（ノート風の背景） */
    body {
        background-color: #f0f2f5;
        background-image: linear-gradient(transparent 95%, #e1e5ea 5%);
        background-size: 100% 1.5em;
        color: #333;
        font-family: "Yu Mincho", "MS Mincho", "Hiragino Mincho ProN", serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
    }

    /* 願書の用紙デザイン */
    #game-container {
        background-color: #ffffff;
        width: 100%;
        max-width: 500px;
        padding: 30px 20px;
        border: 2px solid #2c3e50;
        box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        position: relative;
    }

    /* 内側の細い枠線 */
    #game-container::before {
        content: "";
        position: absolute;
        top: 4px; left: 4px; right: 4px; bottom: 4px;
        border: 1px solid #2c3e50;
        pointer-events: none;
    }

    /* タイトル部分 */
    .form-title {
        color: #2c3e50;
        font-size: 1.6em;
        letter-spacing: 0.3em;
        margin-top: 0;
        margin-bottom: 30px;
        border-bottom: 1px solid #2c3e50;
        padding-bottom: 10px;
        display: inline-block;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
    }

    /* 赤いスタンプ風装飾 */
    .stamp {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        border: 2px solid #d9534f;
        border-radius: 50%;
        color: #d9534f;
        font-weight: bold;
        font-size: 0.9em;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 1.2;
        transform: rotate(15deg);
        opacity: 0.8;
    }

    /* レイアウト（項目と値） */
    .form-row {
        display: flex;
        margin-bottom: 15px;
        align-items: baseline;
    }
    .form-label {
        width: 130px;
        font-size: 0.85em;
        color: #666;
        flex-shrink: 0;
    }
    .form-value {
        font-size: 1.05em;
        color: #111;
        flex-grow: 1;
    }
    .name-value {
        font-size: 1.5em;
        letter-spacing: 0.1em;
    }
    .special-buff {
        color: #d95319;
        font-size: 0.8em;
        display: block;
        font-weight: bold;
        margin-top: 3px;
        font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    /* 入力エリア */
    input[type="text"] {
        font-family: "Yu Mincho", "MS Mincho", serif;
        font-size: 1em;
        padding: 8px;
        border: 1px solid #ccc;
